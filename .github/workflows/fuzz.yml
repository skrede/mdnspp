name: Fuzz testing

on:
  push:
    branches: [master,develop,hardening,fuzz]
  pull_request:
    branches: [master,develop,hardening,fuzz]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-fuzz-${{ hashFiles('lib/mdnspp-asio/CMakeLists.txt', 'lib/mdnspp-encrypt/CMakeLists.txt', 'tests/CMakeLists.txt') }}

      # Corpora accumulate across runs: each run restores the most recent
      # cache, adds the inputs libFuzzer discovers, and saves a new entry.
      - name: Restore accumulated corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus-accumulated
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DMDNSPP_BUILD_FUZZ_TESTS=ON
          -DMDNSPP_ENABLE_ENCRYPT=ON
          -DMDNSPP_CMAKE_FETCH_DEPS=ON

      - name: Build fuzz targets
        run: cmake --build build -j$(nproc)

      - name: Generate seed corpus
        run: cmake --build build --target fuzz_corpus

      - name: Run fuzz harnesses
        run: |
          SEEDS=build/fuzz_corpus
          ACCUM=fuzz-corpus-accumulated
          FUZZ_ARGS="-max_total_time=150 -rss_limit_mb=4096 -print_final_stats=1"

          declare -A CORPUS_MAP=(
            [fuzz_read_dns_name]=read_dns_name
            [fuzz_skip_dns_name]=read_dns_name
            [fuzz_encode_dns_name]=encode_dns_name
            [fuzz_dns_name]=dns_name
            [fuzz_parse_a]=parse_a
            [fuzz_parse_aaaa]=parse_aaaa
            [fuzz_parse_ptr]=parse_ptr
            [fuzz_parse_srv]=parse_srv
            [fuzz_parse_txt]=parse_txt
            [fuzz_walk_dns_frame_raw]=walk_frame
            [fuzz_walk_dns_frame_smart]=walk_frame
            [fuzz_roundtrip_name]=roundtrip
            [fuzz_roundtrip_dns_name]=roundtrip
            [fuzz_match_queries]=server_query
            [fuzz_parse_known_answers]=server_query
            [fuzz_extract_authority]=server_query
            [fuzz_tc_accumulate]=walk_frame
            [fuzz_encrypted_packet]=walk_frame
          )

          failed=0
          for target in "${!CORPUS_MAP[@]}"; do
            seed_dir="${SEEDS}/${CORPUS_MAP[$target]}"
            accum_dir="${ACCUM}/${target}"
            mkdir -p "${accum_dir}"
            echo "::group::${target}"
            if ./build/tests/fuzz/${target} ${FUZZ_ARGS} "${accum_dir}" "${seed_dir}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${target} failed"
              failed=1
            fi
          done

          exit $failed
